; Expense Tracker Theme Configuration
; UI appearance, colors, fonts, and sizing

[window]
width = 1200
height = 700
min_width = 1000
min_height = 600
sidebar_width = 200

[theme]
appearance_mode = dark
color_theme = blue

[colors]
primary = #1f538d
secondary = #14375e
success = #2fa572
danger = #e74c3c
warning = #f39c12
info = #3498db
bg_dark = #1a1a1a
bg_light = #f5f5f5
card_dark = #2b2b2b
card_light = #ffffff
text_dark = #ffffff
text_light = #000000

[color_palette]
primary = #1f538d
primary_hover = #16406f
secondary = #14375e
secondary_hover = #0f2840
success = #2fa572
error = #e74c3c
warning = #f39c12
info = #3498db
background = #1a1a1a
surface = #2b2b2b
card = #2b2b2b
border = #404040
text = #ffffff
text_primary = #ffffff
text_secondary = #b0b0b0

[fonts]
family = Segoe UI

[font_sizes]
title = 24
heading = 18
subheading = 16
body = 14
small = 12
tiny = 10

[font_weights]
normal = normal
bold = bold

[category_colors]
Housing = #FF6B6B
Utilities = #4ECDC4
Groceries = #45B7D1
Dining = #FFA07A
Transportation = #98D8C8
Healthcare = #FF69B4
Insurance = #87CEEB
Personal Care = #DDA0DD
Entertainment = #F7DC6F
Shopping = #BB8FCE
Education = #85C1E2
Travel = #52BE80
Subscriptions = #EC7063
Gifts = #F8B500
Fees = #E74C3C
Other = #95A5A6
Salary = #2ECC71
Business = #3498DB
Investments = #9B59B6
Rental = #1ABC9C
Freelance = #F39C12
Interest = #27AE60
Refunds = #16A085
