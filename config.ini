; Expense Tracker Application Configuration
; Application-level settings: identity, database, business rules, validation

[application]
name = Expense Tracker
version = 1.0.0
author = Your Name
publisher = Your Company Name
url = https://yourwebsite.com
exe_name = ExpenseTracker.exe

[database]
echo = false
debug_mode = false

[currency]
currencies = INR, USD, EUR, GBP, JPY, CAD, AUD
default = INR
code = INR
symbol = ₹
decimal_places = 2

[transactions]
types = Credit, Debit, Transfer
directions = Debit, Credit

[date_formats]
date = %d-%m-%Y
display_date = %d %b %Y
datetime = %d-%m-%Y %H:%M:%S

[pagination]
default_page_size = 50
max_page_size = 100

[validation]
max_description_length = 255
max_notes_length = 1000
max_name_length = 100
min_amount = 0.01
max_amount = 999999999.99
